add_newline = true
command_timeout = 200
# format = "[$directory$git_branch$git_status]($style)$character"

palette = "catppuccin_frappe"

[character]
error_symbol = "[✗](bold pink)"
success_symbol = "[❯](bold pink)"

[directory]
read_only = " 󰌾"
style = "bold lavender"
# truncation_length = 2
# truncation_symbol = "…/"
# repo_root_style = "lavender"
# repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
# format = "[$branch]($style) "
style = "italic yellow"

[git_status]
# format     = '[$all_status]($style)'
style      = "yellow"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "${count} "
up_to_date = " "
untracked  = "?${count} "
modified   = "${count} "
stashed    = " ${count} "
staged     = " ${count} "
renamed    = "󰑕 ${count} "
deleted    = " ${count} "

[cmd_duration]
format = "[took  ]($style)[$duration]($style)"
style = "lavender"

